version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # FastAPI
      - "8080:8080"  # llama.cpp server
    volumes:
      - ./backend:/app/backend  # For hot reloading
      - github_talker_data:/app/models  # Persistent model storage
    environment:
      - PYTHONPATH=/app
      - MODEL_PATH=/app/models/ggml-model.bin
    command: >
      sh -c "cd /app/llama.cpp && 
             ./server -m ../models/ggml-model.bin -c 2048 --host 0.0.0.0 --port 8080 &
             cd /app/backend && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  github_talker_data:  # Persistent volume for model storage 